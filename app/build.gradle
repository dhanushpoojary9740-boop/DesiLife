plugins {
    id 'com.android.application'
}

android {
    namespace 'com.desilife.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.desilife.app'
        minSdk 23
        targetSdk 35

        versionCode 2
        versionName '1.3.0'
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv("DESILIFE_KEYSTORE_PATH")

            if (keystorePath != null) {
                storeFile file(keystorePath)
            }

            storePassword System.getenv("DESILIFE_STORE_PASSWORD")
            keyAlias System.getenv("DESILIFE_KEY_ALIAS")
            keyPassword System.getenv("DESILIFE_KEY_PASSWORD")
        }
    }

    buildTypes {
        debug {
            // Debug builds use Android's debug signing key.
        }

        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
