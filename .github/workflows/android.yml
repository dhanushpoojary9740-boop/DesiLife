
name: Build DesiLife APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK
        run: |
          echo "$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager | sort -V | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK manager not found"
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Accept Android licenses
        run: |
          set -o pipefail
          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" --licenses || true

      - name: Install Android SDK packages
        run: |
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" "platforms;android-35"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Decode and verify release keystore
        env:
          DESILIFE_KEYSTORE_BASE64: ${{ secrets.DESILIFE_KEYSTORE_BASE64 }}
          DESILIFE_STORE_PASSWORD: ${{ secrets.DESILIFE_STORE_PASSWORD }}
          DESILIFE_KEY_ALIAS: ${{ secrets.DESILIFE_KEY_ALIAS }}
          DESILIFE_KEY_PASSWORD: ${{ secrets.DESILIFE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          KEYSTORE_FILE="$RUNNER_TEMP/desilife-release.jks"

          printf '%s' "$DESILIFE_KEYSTORE_BASE64" \
            | base64 --decode > "$KEYSTORE_FILE"

          test -s "$KEYSTORE_FILE"

          echo "Checking keystore password..."

          keytool -list \
            -keystore "$KEYSTORE_FILE" \
            -storepass "$DESILIFE_STORE_PASSWORD" \
            >/dev/null

          echo "Checking key alias..."

          keytool -list \
            -keystore "$KEYSTORE_FILE" \
            -storepass "$DESILIFE_STORE_PASSWORD" \
            -alias "$DESILIFE_KEY_ALIAS" \
            >/dev/null

          echo "DESILIFE_KEYSTORE_PATH=$KEYSTORE_FILE" \
            >> "$GITHUB_ENV"

          echo "Keystore and alias verification successful."

      - name: Build signed DesiLife APK
        env:
          DESILIFE_STORE_PASSWORD: ${{ secrets.DESILIFE_STORE_PASSWORD }}
          DESILIFE_KEY_ALIAS: ${{ secrets.DESILIFE_KEY_ALIAS }}
          DESILIFE_KEY_PASSWORD: ${{ secrets.DESILIFE_KEY_PASSWORD }}
        run: |
          gradle assembleRelease

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: DesiLife-Release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
