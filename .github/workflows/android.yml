name: Build DesiLife APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK
        run: |
          echo "$ANDROID_HOME"
          echo "$ANDROID_HOME/cmdline-tools"

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager | sort -V | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK manager not found"
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Accept Android licenses
        run: |
          set +o pipefail
          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" --licenses
          set -o pipefail

      - name: Install Android SDK packages
        run: |
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" "platforms;android-35"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configure permanent release signing
        env:
          DESILIFE_KEYSTORE_BASE64: ${{ secrets.DESILIFE_KEYSTORE_BASE64 }}
          DESILIFE_STORE_PASSWORD: ${{ secrets.DESILIFE_STORE_PASSWORD }}
          DESILIFE_KEY_ALIAS: ${{ secrets.DESILIFE_KEY_ALIAS }}
          DESILIFE_KEY_PASSWORD: ${{ secrets.DESILIFE_KEY_PASSWORD }}
        run: |
          set -e

          if [ -z "$DESILIFE_KEYSTORE_BASE64" ] || \
             [ -z "$DESILIFE_STORE_PASSWORD" ] || \
             [ -z "$DESILIFE_KEY_ALIAS" ] || \
             [ -z "$DESILIFE_KEY_PASSWORD" ]; then
            echo "Release signing secrets are missing"
            exit 1
          fi

          echo "$DESILIFE_KEYSTORE_BASE64" | \
            base64 --decode > "$RUNNER_TEMP/desilife-release.jks"

          echo "DESILIFE_KEYSTORE_PATH=$RUNNER_TEMP/desilife-release.jks" \
            >> "$GITHUB_ENV"

      - name: Build signed DesiLife APK
        env:
          DESILIFE_STORE_PASSWORD: ${{ secrets.DESILIFE_STORE_PASSWORD }}
          DESILIFE_KEY_ALIAS: ${{ secrets.DESILIFE_KEY_ALIAS }}
          DESILIFE_KEY_PASSWORD: ${{ secrets.DESILIFE_KEY_PASSWORD }}
        run: |
          gradle assembleRelease

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: DesiLife-Release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
